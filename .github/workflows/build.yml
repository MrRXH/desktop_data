name: 自动打包 Mac 与 Windows 桌面软件

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    name: 打包 Mac 版 (.app)
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 Mac 独立应用
        run: |
          pyinstaller --noconfirm --windowed --name "文献助手" \
            --add-data "文献检索软件.html:." \
            --add-data "app/styles.css:app" \
            --add-data "app/app.js:app" \
            --add-data "AI_GUIDE.md:." \
            app/desktop.py

      - name: 压缩为 zip 方便下载
        run: |
          cd dist
          zip -r ../文献助手-Mac.zip "文献助手.app"

      - name: 上传 Mac 成品
        uses: actions/upload-artifact@v4
        with:
          name: 文献助手-Mac版
          path: 文献助手-Mac.zip

  build-windows:
    name: 打包 Windows 版 (.exe)
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装打包依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 Windows 独立软件
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "文献助手" ^
            --add-data "文献检索软件.html;." ^
            --add-data "app/styles.css;app" ^
            --add-data "app/app.js;app" ^
            --add-data "AI_GUIDE.md;." ^
            app/desktop.py

      - name: 上传 Windows 成品
        uses: actions/upload-artifact@v4
        with:
          name: 文献助手-Windows版
          path: dist/文献助手.exe
